<style>
  :root {
    --bg: #5A2832;
    --page: #54323a;
    --fg: #EBF5E1;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--fg); background: var(--page); -webkit-font-smoothing: antialiased;
  }
  .page {
    position: relative; max-width: 580px; min-height: 100vh; margin: 0 auto; overflow: hidden;
    background:
      radial-gradient(ellipse 90% 45% at 50% 42%, rgba(255,255,255,.07), transparent 70%),
      radial-gradient(ellipse 90% 40% at 50% 85%, rgba(255,255,255,.05), transparent 70%),
      var(--bg);
  }
  .page::before { /* subtle grain */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  @media (min-width: 640px) {
    .page { margin-top: 33px; border-radius: 32px 32px 0 0; min-height: calc(100vh - 33px); }
  }
  .hero { position: relative; height: 186px; }
  .hero video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .corner {
    position: absolute; top: 12px; width: 40px; height: 40px; border-radius: 12px; border: 0;
    display: grid; place-items: center; background: rgba(36,52,34,.85); color: #fff; cursor: pointer;
  }
  .corner svg { width: 20px; height: 20px; }
  .corner.left { left: 12px; } .corner.right { right: 12px; }
  @media (min-width: 640px) { .corner { top: 28px; left: auto; } .corner.left { left: 28px; } .corner.right { right: 28px; } }

  main { position: relative; padding: 0 14px 120px; display: flex; flex-direction: column; align-items: center; }
  @media (min-width: 640px) { main { padding: 0 28px 48px; } }
  .avatar {
    width: 100px; height: 100px; margin-top: -50px; border-radius: 50%; overflow: hidden;

  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { margin-top: 18px; font-size: 24px; font-weight: 700; line-height: 1.3; text-align: center; }
  .bio { margin-top: 6px; font-size: 16px; line-height: 1.5; text-align: center; padding: 0 24px; }

  .links { width: 100%; margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .group { display: flex; flex-direction: column; gap: 16px; }
  .group-title { margin: 8px 0 -4px; font-size: 14px; font-weight: 700; text-align: center; line-height: 1.5; }
  .group:first-child .group-title { margin-top: 0; }
  @media (min-width: 640px) { .group-title { font-size: 16px; } }

  .btn {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 64px; padding: 8px 64px;
    background: var(--btn-bg); color: var(--btn-fg);
    border: 0; border-radius: 16px; box-shadow: 0 4px 4px rgba(0,0,0,.12);
    font: inherit; font-size: 14px; font-weight: 400; line-height: 1.4; text-align: center;
    text-decoration: none; cursor: pointer; transition: transform .15s ease;
  }
  @media (min-width: 640px) { .btn { font-size: 16px; } }
  .btn:hover { transform: scale(1.02); }
  .btn .sub { display: flex; align-items: center; gap: 3px; font-size: 12px; opacity: .65; margin-top: 1px; }
  .btn .sub svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
  .btn .thumb {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; display: grid; place-items: center; border-radius: 8px; overflow: hidden;
  }
  .btn .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .btn .thumb .icon { width: 32px; height: 32px; color: var(--btn-fg); }
  .btn .thumb .icon svg { width: 100%; height: 100%; display: block; }
  .btn .more {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; display: grid; place-items: center; opacity: .55;
  }
  .btn .more svg { width: 16px; height: 16px; }

  @keyframes buzz {
    0% { transform: translateX(3px) rotate(1deg); }
    2.5% { transform: translateX(-3px) rotate(-1deg); }
    5% { transform: translateX(3px) rotate(1deg); }
    7.5% { transform: translateX(-3px) rotate(-1deg); }
    10% { transform: translateX(2px) rotate(1deg); }
    12.5% { transform: translateX(-2px) rotate(-1deg); }
    15% { transform: translateX(2px) rotate(1deg); }
    17.5% { transform: translateX(-2px) rotate(-1deg); }
    20% { transform: translateX(1px) rotate(1deg); }
    22.5% { transform: translateX(-1px) rotate(-1deg); }
    25%, 100% { transform: translateX(0) rotate(0); }
  }
  .buzz { animation: buzz 3s linear infinite; }
  .buzz:active { animation: none; }
  @media (prefers-reduced-motion: reduce) { .buzz { animation: none; } }

  /* Featured map card */
  .featured {
    position: relative; display: block; text-decoration: none; color: var(--btn-fg); text-align: center;
    background: var(--btn-bg); border-radius: 16px; padding: 14px 14px 12px;
    box-shadow: 0 4px 4px rgba(0,0,0,.12);
  }
    .mapbox { position: relative; aspect-ratio: 374/212; overflow: hidden; border-radius: 8px; background: #e8e4da; }
  .mapbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .sky { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .cloud { position: absolute; width: 150px; opacity: .85; filter: blur(3px) drop-shadow(0 6px 8px rgba(60,70,90,.35)); animation: drift 26s linear infinite; }
  .cloud svg, .flight svg { display: block; width: 100%; height: auto; }
  .cloud.c1 { top: 4%; animation-delay: -6s; }
  .cloud.c2 { top: 52%; width: 190px; opacity: .7; animation-duration: 34s; animation-delay: -22s; }
  @keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(560px); } }
  .flight { position: absolute; left: 0; top: 0; width: 100%; height: 100%; animation: fly 14s linear infinite; }
  .plane, .shadow { position: absolute; width: 13px; transform: rotate(62deg); }
  .flame { transform-origin: 20px 186px; animation: flicker .12s ease-in-out infinite alternate; }
  .shadow .flame { display: none; }
  @keyframes flicker { from { transform: scaleY(.8); } to { transform: scaleY(1.15); } }
  .plane { left: 0; top: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .shadow { left: 30px; top: 30px; width: 12px; filter: brightness(0) blur(2px); opacity: .3; }
  @keyframes fly {
    from { transform: translate(-60px, 150px); }
    to { transform: translate(calc(100% + 40px), -60px); }
  }
  @media (prefers-reduced-motion: reduce) { .cloud, .flight { animation: none; } .flight { transform: translate(62%, 30%); } }
  .featured:hover { transform: none; }
  .featured .t { margin-top: 10px; font-size: 14px; font-weight: 500; }
  .featured .sub { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; opacity: .65; }
  .featured .sub svg { width: 12px; height: 12px; fill: currentColor; }
  .featured .dir {
    display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 10px; color: inherit; text-decoration: none;

  .modal {

  .sheet {
    width: 100%; max-width: 580px; max-height: 88vh; overflow: auto;

  .close {

  .sheet p { white-space: pre-line; font-size: 15px; line-height: 1.6; }
  .sheet iframe { width: 100%; aspect-ratio: 374/212; border: 0; border-radius: 12px; display: block; margin-bottom: 12px; }
  .sheet .pill {
    display: block; margin-top: 20px; padding: 14px; text-align: center; border-radius: 12px;
    background: #1e2330; color: #fff; font-weight: 600; font-size: 15px; text-decoration: none;
  }
  .sheet .pill.disabled { opacity: .5; pointer-events: none; }
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 20;
    background: #1e2330; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>

  ]},

const ICONS = {"filled-circle-number-2": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\" ><path d=\"M12 2c5.523 0 10 4.477 10 10s-4.477 10 -10 10s-10 -4.477 -10 -10s4.477 -10 10 -10zm1 5h-3l-.117 .007a1 1 0 0 0 0 1.986l.117 .007h3v2h-2l-.15 .005a2 2 0 0 0 -1.844 1.838l-.006 .157v2l.005 .15a2 2 0 0 0 1.838 1.844l.157 .006h3l.117 -.007a1 1 0 0 0 0 -1.986l-.117 -.007h-3v-2h2l.15 -.005a2 2 0 0 0 1.844 -1.838l.006 -.157v-2l-.005 -.15a2 2 0 0 0 -1.838 -1.844l-.157 -.006z\" /></svg>", "filled-parking-circle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\" ><path d=\"M12 2c5.523 0 10 4.477 10 10a10 10 0 0 1 -20 0l.004 -.28c.148 -5.393 4.566 -9.72 9.996 -9.72m1.334 5h-3.334a1 1 0 0 0 -1 1v8a1 1 0 0 0 1 1l.117 -.007a1 1 0 0 0 .883 -.993v-3h2.334c1.516 0 2.666 -1.38 2.666 -3s-1.15 -3 -2.666 -3m0 2c.323 0 .666 .411 .666 1s-.343 1 -.666 1h-2.334v-2z\" /></svg>", "outline-book": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0\" /><path d=\"M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0\" /><path d=\"M3 6l0 13\" /><path d=\"M12 6l0 13\" /><path d=\"M21 6l0 13\" /></svg>", "outline-brand-appstore": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0\" /><path d=\"M8 16l1.106 -1.99m1.4 -2.522l2.494 -4.488\" /><path d=\"M7 14h5m2.9 0h2.1\" /><path d=\"M16 16l-2.51 -4.518m-1.487 -2.677l-1 -1.805\" /></svg>", "outline-brand-wechat": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M16.5 10c3.038 0 5.5 2.015 5.5 4.5c0 1.397 -.778 2.645 -2 3.47l0 2.03l-1.964 -1.178a6.649 6.649 0 0 1 -1.536 .178c-3.038 0 -5.5 -2.015 -5.5 -4.5s2.462 -4.5 5.5 -4.5z\" /><path d=\"M11.197 15.698c-.69 .196 -1.43 .302 -2.197 .302a8.008 8.008 0 0 1 -2.612 -.432l-2.388 1.432v-2.801c-1.237 -1.082 -2 -2.564 -2 -4.199c0 -3.314 3.134 -6 7 -6c3.782 0 6.863 2.57 7 5.785l0 .233\" /><path d=\"M10 8h.01\" /><path d=\"M7 8h.01\" /><path d=\"M15 14h.01\" /><path d=\"M18 14h.01\" /></svg>", "outline-circle-number-1": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0\" /><path d=\"M10 10l2 -2v8\" /></svg>", "outline-door-enter": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M13 12v.01\" /><path d=\"M3 21h18\" /><path d=\"M5 21v-16a2 2 0 0 1 2 -2h6m4 10.5v7.5\" /><path d=\"M21 7h-7m3 -3l-3 3l3 3\" /></svg>", "outline-door-exit": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M13 12v.01\" /><path d=\"M3 21h18\" /><path d=\"M5 21v-16a2 2 0 0 1 2 -2h7.5m2.5 10.5v7.5\" /><path d=\"M14 7h7m-3 -3l3 3l-3 3\" /></svg>", "outline-golf": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M12 18v-15l7 4l-7 4\" /><path d=\"M9 17.67c-.62 .36 -1 .82 -1 1.33c0 1.1 1.8 2 4 2s4 -.9 4 -2c0 -.5 -.38 -.97 -1 -1.33\" /></svg>", "outline-parking-circle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M10 16v-8h3.334c.92 0 1.666 .895 1.666 2s-.746 2 -1.666 2h-3.334\" /><path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\" /></svg>", "outline-parking": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ><path d=\"M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14z\" /><path d=\"M10 16v-8h2.667c.736 0 1.333 .895 1.333 2s-.597 2 -1.333 2h-2.667\" /></svg>"};
const DOTS = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
const PIN = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24"><path d="M4 2.5v19a1 1 0 0 0 1.5.9L21 13a1.2 1.2 0 0 0 0-2L5.5 1.6A1 1 0 0 0 4 2.5z"/></svg>';

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const thumb = it => it.img
  ? `<span class="thumb"><img src="${it.img}" alt=""></span>`
  : it.icon ? `<span class="thumb"><span class="icon">${ICONS[it.icon]}</span></span>` : "";
const sub = it => it.sub ? `<span class="sub">${it.subIcon === "play" ? PLAY : PIN}${esc(it.sub)}</span>` : "";
const more = `<span class="more">${DOTS}</span>`;
// Official Google Maps embed (keyless "Share > Embed a map" form)
const embed = geo => `https://maps.google.com/maps?q=${geo}&z=16&hl=zh-TW&output=embed`;
// Starship-style two-stage stainless rocket (generic, no logos)
const ROCKET = `<svg viewBox="0 0 40 220"><defs><linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#7d8790"/><stop offset=".45" stop-color="#f3f5f7"/><stop offset=".6" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6f7881"/></linearGradient></defs>
  <g class="flame"><path d="M11 186c0 14 4 26 9 34 5-8 9-20 9-34z" fill="#ff8a1f"/><path d="M14 186c0 9 3 16 6 21 3-5 6-12 6-21z" fill="#fff3b0"/><path d="M17 186c0 5 1.5 8 3 10 1.5-2 3-5 3-10z" fill="#9fd4ff"/></g>
  <path d="M10 104h20v80H10z" fill="url(#steel)" stroke="#5c646c" stroke-width=".8"/>
  <path d="M11 184h18v3H11z" fill="#3a3f45"/>
  <path d="M5 110h5v6H5zM30 110h5v6h-5z" fill="#3a3f45"/>
  <path d="M10 99h20v5H10z" fill="#3a3f45"/>
  <path d="M20 2C27 10 30 22 30 34v65H10V34C10 22 13 10 20 2z" fill="url(#steel)" stroke="#5c646c" stroke-width=".8"/>
  <path d="M10 26l-5 6v10l5-3zM30 26l5 6v10l-5-3z" fill="#2f3439"/>
  <path d="M10 78l-6 6v15h6zM30 78l6 6v15h-6z" fill="#2f3439"/>
  <path d="M10 60h20M10 140h20M10 160h20" stroke="#9aa3ad" stroke-width=".6"/></svg>`;
const CLOUD = `<svg viewBox="0 0 120 60"><path fill="#fff" d="M28 52C14 52 6 44 6 35s8-16 18-16c3-9 11-15 21-15 11 0 19 7 21 17 2-1 5-2 8-2 10 0 17 7 17 15 9 1 16 7 16 15 0 2 0 3-1 3H28z"/></svg>`;
const sky = `<div class="sky" aria-hidden="true">
  <span class="cloud c1">${CLOUD}</span><span class="cloud c2">${CLOUD}</span>
  <span class="flight"><span class="shadow">${ROCKET}</span><span class="plane">${ROCKET}</span></span>
</div>`;

function render(it, gi, ii) {
  const id = `${gi}-${ii}`;
  switch (it.kind) {
    case "link":
      return `<a class="btn${it.buzz ? " buzz" : ""}" href="${esc(it.url)}" target="_blank" rel="noopener">${thumb(it)}<span>${esc(it.title)}</span>${sub(it)}${more}</a>`;
    case "notice":
    case "map":
      return `<button class="btn" type="button" data-open="${id}">${thumb(it)}<span>${esc(it.title)}</span>${sub(it)}${more}</button>`;
    case "featured-map":
      return `<div class="featured"><div class="mapbox"><iframe src="${embed(it.geo)}" title="${esc(it.title)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>${sky}</div><div class="t">${esc(it.title)}</div><div class="sub">${PIN}${esc(it.sub)}</div><div><a class="dir" href="${esc(it.url)}" target="_blank" rel="noopener">Get directions</a></div>${more}</div>`;
  }
}

document.getElementById("links").innerHTML = GROUPS.map((g, gi) => `
  <section class="group">
    <h2 class="group-title">${esc(g.title)}</h2>
    ${g.items.map((it, ii) => render(it, gi, ii)).join("")}
  </section>`).join("");

// Notice / map modal
const modal = document.getElementById("modal");
const mBtn = document.getElementById("modal-btn");
const mMap = document.getElementById("modal-map");
document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => {
  const [gi, ii] = b.dataset.open.split("-").map(Number);
  const it = GROUPS[gi].items[ii];
  document.getElementById("modal-title").textContent = it.title;
  const isMap = it.kind === "map";
  document.getElementById("modal-body").textContent = isMap ? `${it.name}\n${it.addr}` : it.body;
  mMap.hidden = !isMap;
  mMap.src = isMap ? embed(it.geo) : "about:blank";
  const btnTitle = isMap ? "Get directions" : it.btnTitle;
  const btnUrl = isMap ? it.url : it.btnUrl;
  mBtn.textContent = btnTitle;
  if (btnUrl) { mBtn.href = btnUrl; mBtn.classList.remove("disabled"); }
  else { mBtn.removeAttribute("href"); mBtn.classList.add("disabled"); }
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}));

// Share
document.getElementById("share").addEventListener("click", async () => {
  const data = { title: "@driveroom.ft", url: location.href };
  try {
    if (navigator.share) return await navigator.share(data);
    await navigator.clipboard.writeText(location.href);
    const t = document.getElementById("toast");
    t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600);
  } catch (e) {}
});
const closeModal = () => { modal.classList.remove("open"); document.body.style.overflow = ""; };
modal.querySelector(".close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
